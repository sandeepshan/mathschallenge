<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MAV Maths Challenge — Grade 5 Prep</title>
<meta name="description" content="Grade 5 maths practice for the Maths Association of Victoria competition — adaptive questions, results and achievements.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4338ca">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAV Maths">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<style>
  :root{
    --bronze:#cd7f32; --silver:#9aa5b1; --gold:#f2b705; --platinum:#7fd8e0; --diamond:#a78bfa; --legendary:#fb4f8b;
    --bg1:#0f172a; --card:#ffffff; --ink:#1e293b; --muted:#64748b;
    --brand1:#6366f1; --brand2:#22c55e; --brand3:#f97316; --danger:#ef4444; --ok:#16a34a;
    --radius:20px;
    font-family: "Segoe UI Rounded","Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 8% 8%, #4338ca 0%, transparent 42%),
      radial-gradient(circle at 92% 15%, #0891b2 0%, transparent 42%),
      radial-gradient(circle at 50% 95%, #db2777 0%, transparent 38%),
      radial-gradient(circle at 25% 60%, #ea580c 0%, transparent 30%),
      linear-gradient(160deg,#0f172a,#1e1b4b 55%,#0f172a);
    background-attachment:fixed;
    color:var(--ink); padding:20px; display:flex; justify-content:center;
  }
  .app{width:100%; max-width:960px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; color:#fff; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .logo{font-size:36px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));}
  .brand h1{font-size:21px; margin:0; letter-spacing:.3px; background:linear-gradient(90deg,#fff,#c7d2fe); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand p{margin:0; font-size:12px; opacity:.8;}
  nav.tabs{display:flex; gap:6px; background:rgba(255,255,255,.1); backdrop-filter:blur(6px); padding:6px; border-radius:14px; border:1px solid rgba(255,255,255,.12);}
  nav.tabs button{
    background:transparent; border:none; color:#e2e8f0; padding:9px 15px; border-radius:10px;
    cursor:pointer; font-weight:700; font-size:13px; transition:.15s;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.12);}
  nav.tabs button.active{background:#fff; color:#312e81; box-shadow:0 4px 12px rgba(0,0,0,.25);}

  .card{background:var(--card); border-radius:var(--radius); padding:26px; box-shadow:0 24px 60px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.5);}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .card.enter{ animation: fadeIn .32s ease; }
  .muted{color:var(--muted);}
  h2{margin-top:0; letter-spacing:.2px;}
  h3{margin-bottom:10px;}
  .section-title{display:flex; align-items:center; gap:8px; font-size:16px; margin:0 0 12px;}
  .grid{display:grid; gap:14px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:640px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;} }

  /* Mascot / hero */
  .hero-bubble{
    display:flex; align-items:flex-start; gap:14px; background:linear-gradient(135deg,#eef2ff,#fdf4ff);
    border:1px solid #e0e7ff; border-radius:16px; padding:16px 18px; margin-bottom:20px;
  }
  .hero-bubble .mascot{font-size:40px; flex-shrink:0;}
  .hero-bubble p{margin:0; font-size:14px; font-weight:600; color:#3730a3; line-height:1.5;}

  .topic-pill{
    border:2px solid #e2e8f0; border-radius:14px; padding:12px; cursor:pointer;
    display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px;
    transition:.15s; user-select:none; background:#f8fafc; position:relative; overflow:hidden;
  }
  .topic-pill:hover{transform:translateY(-2px); box-shadow:0 8px 16px rgba(0,0,0,.08);}
  .topic-pill .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .topic-pill.selected{border-color:var(--brand1); background:#eef2ff; color:#3730a3;}
  .topic-pill .em{font-size:20px;}

  .choice-row{display:flex; gap:10px; flex-wrap:wrap;}
  .choice-btn{
    flex:1; min-width:110px; border:2px solid #e2e8f0; background:#f8fafc; border-radius:12px;
    padding:12px; cursor:pointer; font-weight:700; font-size:14px; text-align:center; transition:.15s;
  }
  .choice-btn:hover{transform:translateY(-1px);}
  .choice-btn.active{border-color:var(--brand2); background:#ecfdf5; color:#065f46;}

  .btn{
    border:none; border-radius:12px; padding:12px 20px; font-weight:800; font-size:15px;
    cursor:pointer; color:#fff; background:linear-gradient(135deg,var(--brand1),#8b5cf6);
    box-shadow:0 8px 18px rgba(99,102,241,.35); transition:.12s;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 10px 22px rgba(99,102,241,.42);}
  .btn.secondary{background:#f1f5f9; color:#334155; box-shadow:none;}
  .btn.big{width:100%; padding:16px; font-size:17px; margin-top:10px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn:active{transform:scale(.98);}

  .stat-card{background:linear-gradient(160deg,#f8fafc,#eef2ff); border-radius:14px; padding:14px; text-align:center; transition:.15s; border:1px solid #eef0f5;}
  .stat-card:hover{transform:translateY(-2px);}
  .stat-card .num{font-size:24px; font-weight:800; color:#312e81;}
  .stat-card .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}

  /* Quiz screen */
  .quiz-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .tier-badge{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:800; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.15);}
  .progress-bar{height:10px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin-bottom:16px;}
  .progress-bar > div{height:100%; background:linear-gradient(90deg,var(--brand2),#059669); transition:width .3s;}
  .streak-chip{font-size:13px; font-weight:700; color:#b45309; background:#fffbeb; padding:4px 10px; border-radius:999px;}
  .timer-chip{font-size:13px; font-weight:700; color:#be123c; background:#fef2f2; padding:4px 10px; border-radius:999px;}
  .question-box{font-size:22px; font-weight:800; margin:18px 0 22px; line-height:1.4; color:#1e1b4b;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){.options{grid-template-columns:1fr;}}
  .opt-btn{
    border:2px solid #e2e8f0; background:#fff; border-radius:14px; padding:16px; text-align:left;
    font-size:16px; font-weight:700; cursor:pointer; transition:.12s;
  }
  .opt-btn:hover{border-color:#a5b4fc; transform:translateY(-1px);}
  .opt-btn.correct{background:#dcfce7; border-color:#22c55e; color:#166534;}
  .opt-btn.wrong{background:#fee2e2; border-color:#ef4444; color:#991b1b;}
  .opt-btn.dim{opacity:.55;}
  .feedback{margin-top:16px; padding:14px; border-radius:12px; font-size:14px; font-weight:600;}
  .feedback.ok{background:#ecfdf5; color:#065f46;}
  .feedback.no{background:#fef2f2; color:#991b1b;}

  /* Results */
  .badge-earned{display:inline-flex; align-items:center; gap:6px; background:#fffbeb; border:1px solid #fbbf24; padding:6px 12px; border-radius:999px; font-weight:700; font-size:13px; color:#92400e; margin:4px 6px 0 0;}
  .rankup-banner{background:linear-gradient(135deg,#312e81,#7c3aed); color:#fff; padding:14px 18px; border-radius:14px; font-weight:700; margin-top:16px; box-shadow:0 10px 24px rgba(99,102,241,.35);}

  /* Quick modes */
  .mode-card{
    border-radius:16px; padding:16px; cursor:pointer; position:relative; overflow:hidden;
    color:#fff; transition:.15s; border:none; text-align:left; display:flex; flex-direction:column; gap:4px;
  }
  .mode-card:hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,0,0,.25);}
  .mode-card .mc-icon{font-size:26px;}
  .mode-card .mc-title{font-weight:800; font-size:15px;}
  .mode-card .mc-sub{font-size:12px; opacity:.9; font-weight:600;}
  .mode-card.daily{background:linear-gradient(135deg,#0891b2,#0e7490);}
  .mode-card.speed{background:linear-gradient(135deg,#f59e0b,#ea580c);}
  .mode-card.boss{background:linear-gradient(135deg,#7c3aed,#be123c);}
  .mode-card.locked{background:linear-gradient(135deg,#64748b,#475569); cursor:not-allowed; opacity:.75;}
  .mode-card.done{background:linear-gradient(135deg,#16a34a,#15803d);}

  .boss-hp-wrap{margin:10px 0 18px;}
  .boss-hp-label{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#7c2d12; margin-bottom:4px;}
  .boss-hp-bar{height:18px; background:#fee2e2; border-radius:999px; overflow:hidden; border:2px solid #fecaca;}
  .boss-hp-bar > div{height:100%; background:linear-gradient(90deg,#dc2626,#f97316); transition:width .4s;}
  .boss-banner{background:linear-gradient(135deg,#4c1d95,#7c3aed); color:#fff; padding:14px 18px; border-radius:14px; font-weight:700; margin-top:16px; box-shadow:0 10px 24px rgba(124,58,237,.35);}
  .speed-count{font-size:36px; font-weight:900; color:#c2410c; text-align:center; margin:6px 0 2px;}
  table.review{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  table.review th, table.review td{padding:8px; border-bottom:1px solid #e2e8f0; text-align:left;}
  .topic-chip{display:inline-flex; align-items:center; gap:6px; font-weight:700;}
  .topic-chip .swatch{width:9px; height:9px; border-radius:50%;}

  /* Progress screen */
  .mastery-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .mastery-row .name{width:180px; font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px;}
  .mastery-track{flex:1; height:14px; background:#e2e8f0; border-radius:999px; overflow:hidden;}
  .mastery-fill{height:100%; border-radius:999px; transition:width .4s;}
  .mastery-pct{width:90px; text-align:right; font-size:12px; color:var(--muted);}

  .heatmap{display:grid; grid-template-columns:repeat(14,1fr); gap:5px;}
  .heat-cell{aspect-ratio:1; border-radius:5px; background:#e2e8f0;}
  .heat-cell.did{background:var(--brand2);}
  .heat-cell.today{outline:2px solid #312e81;}

  .insight-card{
    border-radius:14px; padding:14px 16px; margin-bottom:10px; border:1px solid #fde68a;
    background:linear-gradient(135deg,#fffbeb,#fff7ed); display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .insight-card .info{flex:1; min-width:200px;}
  .insight-card .accbadge{font-weight:800; font-size:18px; color:#92400e;}
  .trend-banner{border-radius:14px; padding:14px 16px; margin-bottom:16px; font-weight:700; font-size:14px;}
  .trend-up{background:#ecfdf5; color:#065f46; border:1px solid #86efac;}
  .trend-down{background:#fef2f2; color:#991b1b; border:1px solid #fca5a5;}
  .trend-flat{background:#f1f5f9; color:#334155; border:1px solid #e2e8f0;}

  /* Achievements */
  .xp-hero{
    display:flex; align-items:center; gap:16px; background:linear-gradient(135deg,#1e1b4b,#4338ca 60%,#7c3aed);
    color:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 16px 32px rgba(67,56,202,.35);
  }
  .xp-mascot{font-size:44px;}
  .xp-track{height:12px; background:rgba(255,255,255,.25); border-radius:999px; overflow:hidden; margin-top:8px;}
  .xp-fill{height:100%; background:linear-gradient(90deg,#fbbf24,#f97316); transition:width .5s;}
  .badge-cat-title{margin:18px 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);}
  .badges-shelf{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media (max-width:640px){.badges-shelf{grid-template-columns:repeat(3,1fr);}}
  .badge-tile{background:#f8fafc; border-radius:12px; padding:10px 6px; text-align:center; font-size:11px; font-weight:700; border:1px solid #eef0f5;}
  .badge-tile .ic{font-size:26px; display:block; margin-bottom:4px;}
  .badge-tile.locked{opacity:.4; filter:grayscale(1);}
  .badge-tile.earned{border-color:#fbbf24; background:linear-gradient(160deg,#fffbeb,#fff);}

  .chart-wrap{background:#f8fafc; border-radius:14px; padding:14px; margin-bottom:6px;}

  .hidden{display:none !important;}
  .confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
  .confetti-piece{position:absolute; top:-20px; width:9px; height:14px; opacity:.9; animation:fall linear forwards;}
  @keyframes fall{ to{ transform:translateY(110vh) rotate(400deg); opacity:1;} }

  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#111827; color:#fff;
    padding:12px 22px; border-radius:999px; font-weight:700; font-size:14px; z-index:1000;
    box-shadow:0 10px 30px rgba(0,0,0,.4); animation:toastin .25s ease;
  }
  @keyframes toastin{ from{opacity:0; transform:translate(-50%,-10px);} to{opacity:1; transform:translate(-50%,0);} }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.65); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:1100; padding:20px; animation:fadeIn .2s ease;
  }
  .modal-card{background:#fff; border-radius:20px; padding:28px; max-width:380px; width:100%; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,.4);}

  footer{text-align:center; color:rgba(255,255,255,.5); font-size:11px; margin-top:18px;}

  /* ===== Mobile / PWA polish ===== */
  html{ -webkit-text-size-adjust:100%; }
  body{
    padding:20px env(safe-area-inset-right,20px) calc(20px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,20px);
    -webkit-tap-highlight-color:transparent;
  }
  input, select, textarea, button{ font-size:16px; } /* prevents iOS auto-zoom on focus */
  ::-webkit-scrollbar{ width:8px; height:8px; }

  @media (max-width:640px){
    body{ padding:12px env(safe-area-inset-right,12px) calc(14px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,12px); }
    .card{ padding:18px; border-radius:16px; }
    .brand h1{ font-size:17px; }
    .brand p{ display:none; }
    .brand .logo{ font-size:28px; }
    nav.tabs{ width:100%; justify-content:space-between; }
    nav.tabs button{ flex:1; padding:9px 6px; font-size:12px; }
    .question-box{ font-size:19px; margin:14px 0 18px; }
    .opt-btn{ padding:14px; font-size:15px; }
    .xp-hero{ flex-direction:column; align-items:flex-start; text-align:left; }
    .badges-shelf{ grid-template-columns:repeat(3,1fr); gap:8px; }
    .mastery-row .name{ width:auto; flex:1; }
    .mastery-pct{ width:auto; }
    .grid.cols-4{ grid-template-columns:1fr 1fr; }
    .insight-card{ flex-direction:column; align-items:flex-start; }
    table.review{ font-size:12px; }
    .heatmap{ grid-template-columns:repeat(10,1fr); }
  }
  @media (max-width:380px){
    .badges-shelf{ grid-template-columns:repeat(2,1fr); }
    .choice-btn{ min-width:90px; font-size:12.5px; padding:10px; }
    .stat-card .num{ font-size:20px; }
    nav.tabs button{ font-size:11px; padding:8px 4px; }
  }

  /* Standalone (installed PWA) tweaks: a little extra top breathing room under status bar */
  @media (display-mode:standalone){
    body{ padding-top:calc(20px + env(safe-area-inset-top,0px)); }
    @media (max-width:640px){ body{ padding-top:calc(12px + env(safe-area-inset-top,0px)); } }
  }
</style>
