/* =========================================================
   DAILY CHALLENGE (deterministic per-date question set,
   so every device sees the same 5 questions on a given day)
========================================================= */
function mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t>>>15, t | 1);
    t ^= t + Math.imul(t ^ t>>>7, t | 61);
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function dateSeed(dateStr){
  let h=0;
  for(let i=0;i<dateStr.length;i++){ h = (h*31 + dateStr.charCodeAt(i))|0; }
  return h>>>0;
}
const DAILY_QUESTION_COUNT = 6;
function dailyLevelFor(dateStr){
  // cycles deterministically through a fun, varied spread of difficulty (Silver–Legendary)
  const spread = [3,5,6,7,8,9,10,11];
  return spread[dateSeed(dateStr) % spread.length];
}
function generateDailyChallengeQuestions(dateStr){
  const originalRandom = Math.random;
  Math.random = mulberry32(dateSeed(dateStr));
  try{
    const level = dailyLevelFor(dateStr);
    const topicIds = TOPICS.map(t=>t.id);
    const askedSigs = new Set();
    const qs = [];
    for(let i=0;i<DAILY_QUESTION_COUNT;i++){
      let q=null, tries=0;
      while(tries<40){
        tries++;
        const topicId = topicIds[Math.floor(Math.random()*topicIds.length)];
        let candidate;
        try{ candidate = topicById(topicId).gen(level); }catch(e){ continue; }
        if(!candidate || !candidate.prompt || askedSigs.has(candidate.sig)) continue;
        candidate.topicId = topicId;
        q = candidate;
        break;
      }
      if(!q){ const topicId = topicIds[i%topicIds.length]; q = topicById(topicId).gen(level); q.topicId = topicId; }
      askedSigs.add(q.sig);
      qs.push(q);
    }
    return {level, questions: qs};
  } finally {
    Math.random = originalRandom;
  }
}
function isDailyChallengeDoneToday(){ return PROGRESS.daily.lastCompletedDate === todayStr(); }

/* =========================================================
   BOSS BATTLE — unlocks every 5 completed sessions
========================================================= */
function bossBattlesUnlocked(){ return Math.floor(PROGRESS.sessions.length/5); }
function bossBattleAvailable(){ return bossBattlesUnlocked() > PROGRESS.bossBattle.bossesDefeated; }
function bossLevelFor(){
  return Math.min(12, Math.max(7, startingLevelFor(TOPICS.map(t=>t.id))+1));
}

/* =========================================================
   QUIZ ENGINE
========================================================= */
let SESSION = null;
let timerInterval = null;
let speedTimerInterval = null;

function startingLevelFor(topicIds){
  let sum=0, n=0;
  topicIds.forEach(id=>{
    const m = PROGRESS.topicMastery[id];
    if(m && m.totalAnswered>=5){ sum += Math.max(2, m.highestLevel-1); n++; }
  });
  if(n===0) return 5;
  return Math.min(11, Math.max(1, Math.round(sum/n)));
}

function startSession(focusTopicId){
  const topicIds = focusTopicId ? [focusTopicId] : [...selectedTopics];
  const count = focusTopicId ? 10 : selectedCount;
  const mode = focusTopicId ? 'practice' : selectedMode;
  SESSION = {
    topics: topicIds,
    mode,
    questionCount: count,
    level: focusTopicId ? startingLevelFor(topicIds) : resolveStartLevel(topicIds),
    correctStreak: 0,
    wrongStreak: 0,
    bestStreak: 0,
    idx: 0,
    correctCount: 0,
    points: 0,
    cluesRemaining: 3,
    cluesUsed: 0,
    askedSigs: new Set(),
    perTopic: {},
    reviewList: [],
    startTime: Date.now(),
    current: null,
    answered: false,
  };
  topicIds.forEach(id=> SESSION.perTopic[id] = {answered:0, correct:0});
  showScreen('quiz');
  nextQuestion();
}

function startSpeedRound(){
  const topicIds = TOPICS.map(t=>t.id);
  SESSION = {
    topics: topicIds,
    mode: 'speed',
    questionCount: 999,
    level: startingLevelFor(topicIds),
    correctStreak: 0,
    wrongStreak: 0,
    bestStreak: 0,
    idx: 0,
    correctCount: 0,
    points: 0,
    cluesRemaining: 0,
    cluesUsed: 0,
    askedSigs: new Set(),
    perTopic: {},
    reviewList: [],
    startTime: Date.now(),
    current: null,
    answered: false,
    speedTimeLeft: 60,
  };
  topicIds.forEach(id=> SESSION.perTopic[id] = {answered:0, correct:0});
  showScreen('quiz');
  nextQuestion();
  clearInterval(speedTimerInterval);
  speedTimerInterval = setInterval(()=>{
    SESSION.speedTimeLeft--;
    const chip = $('#speed-timer-chip');
    if(chip) chip.textContent = `⏱️ ${SESSION.speedTimeLeft}s`;
    if(SESSION.speedTimeLeft<=0){
      clearInterval(speedTimerInterval);
      clearInterval(timerInterval);
      finishSession();
    }
  }, 1000);
}

  if(!bossBattleAvailable()) return;

    mode: 'boss',

    wrongStreak: 0,
    bestStreak: 0,
    idx: 0,
    correctCount: 0,

function startDailyChallenge(){
  if(isDailyChallengeDoneToday()){ showToast("You've already completed today's Daily Challenge — come back tomorrow!"); return; }
  const {level, questions} = generateDailyChallengeQuestions(todayStr());
  const topicIds = TOPICS.map(t=>t.id);
  SESSION = {
    topics: topicIds,
    mode: 'daily',
    questionCount: questions.length,
    level,
    fixedLevel: true,
    dailyQuestions: questions,
    correctStreak: 0,
    wrongStreak: 0,
    bestStreak: 0,
    idx: 0,
    correctCount: 0,
    points: 0,
    cluesRemaining: 3,
    cluesUsed: 0,
    askedSigs: new Set(),
    perTopic: {},
    reviewList: [],
    startTime: Date.now(),
    current: null,
    answered: false,
  };
  topicIds.forEach(id=> SESSION.perTopic[id] = {answered:0, correct:0});
  showScreen('quiz');
  nextQuestion();
}

function pickTopicId(){
  return choice(SESSION.topics);
}

function generateUniqueQuestion(){
  let q=null, tries=0;
  while(tries<40){
    tries++;
    const topicId = pickTopicId();
    const topic = topicById(topicId);
    let candidate;
    try{ candidate = topic.gen(SESSION.level); }catch(e){ continue; }
    if(!candidate || !candidate.prompt) continue;
    if(SESSION.askedSigs.has(candidate.sig)) continue;
    candidate.topicId = topicId;
    q = candidate;
    break;
  }
  if(!q){
    const topicId = pickTopicId();
    q = topicById(topicId).gen(SESSION.level);
    q.topicId = topicId;
  }
  SESSION.askedSigs.add(q.sig);
  return q;
}

function nextQuestion(){
  clearInterval(timerInterval);
  if(SESSION.idx >= SESSION.questionCount){ finishSession(); return; }
  SESSION.current = SESSION.mode==='daily' ? SESSION.dailyQuestions[SESSION.idx] : generateUniqueQuestion();
  SESSION.current.clueUsedThisQ = false;
  SESSION.answered = false;
  SESSION.timeLeft = 45;
  renderQuiz();
  if(SESSION.mode==='challenge'){
    timerInterval = setInterval(()=>{
      SESSION.timeLeft--;
      const chip = $('#timer-chip');
      if(chip) chip.textContent = `⏱️ ${SESSION.timeLeft}s`;
      if(SESSION.timeLeft<=0){ clearInterval(timerInterval); submitAnswer(-1); }
    }, 1000);
  }
}

function renderQuiz(){
  const el = document.getElementById('screen-quiz');
  const tier = tierInfo(SESSION.level);
  const topic = topicById(SESSION.current.topicId);
  const pct = Math.round(100*SESSION.idx/SESSION.questionCount);

    : SESSION.mode==='daily' ? `<span class="tier-badge" style="background:linear-gradient(135deg,#0891b2,#0e7490);">🗓️ Daily Challenge</span>`

    : SESSION.mode==='speed'

      : `<div class="progress-bar"><div style="width:${pct}%;"></div></div><div class="muted" style="font-size:12px; margin-bottom:6px;">Question ${SESSION.idx+1} of ${SESSION.questionCount}</div>`;
  el.innerHTML = `
    <div class="quiz-head">
      <div class="topic-chip"><span class="swatch" style="background:${topic.color};"></span>${topic.icon} ${topic.name}</div>
      <div style="display:flex; gap:10px; align-items:center;">
        ${SESSION.correctStreak>=2? `<span class="streak-chip">🔥 ${SESSION.correctStreak} streak</span>`:''}
        ${SESSION.mode==='challenge'? `<span class="timer-chip" id="timer-chip">⏱️ ${SESSION.timeLeft}s</span>`:''}
        ${SESSION.mode==='speed'? `<span class="timer-chip" id="speed-timer-chip">⏱️ ${SESSION.speedTimeLeft}s</span>`:''}
        ${modeBadge}
      </div>
    </div>
    ${progressRow}
    <div class="question-box">${SESSION.current.prompt}</div>
    <div style="display:flex; justify-content:flex-end; margin-bottom:12px;">
      ${SESSION.cluesRemaining>0 || SESSION.mode!=='speed' ? `<button class="btn secondary" id="clue-btn" style="font-size:13px; padding:9px 14px;" ${SESSION.cluesRemaining<=0?'disabled':''}>💡 Use a clue (${SESSION.cluesRemaining} left)</button>` : ''}
    </div>
    <div id="clue-box"></div>
    <div class="options" id="opts"></div>
    <div id="feedback"></div>
  `;
  const optsEl = $('#opts');
  SESSION.current.options.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className='opt-btn'; b.textContent = opt;
    b.addEventListener('click', ()=>submitAnswer(i));
    optsEl.appendChild(b);
  });
  const clueBtn = $('#clue-btn');
  if(clueBtn) clueBtn.addEventListener('click', useClue);
}

function useClue(){
  if(SESSION.answered || SESSION.cluesRemaining<=0 || SESSION.current.clueUsedThisQ) return;
  const q = SESSION.current;
  q.clueUsedThisQ = true;
  SESSION.cluesRemaining--;
  SESSION.cluesUsed++;

  const wrongIndices = [0,1,2,3].filter(i=>i!==q.correctIndex);
  const toEliminate = choice(wrongIndices);
  const buttons = $$('#opts .opt-btn');
  if(buttons[toEliminate]){
    buttons[toEliminate].disabled = true;
    buttons[toEliminate].classList.add('dim');
    buttons[toEliminate].style.textDecoration = 'line-through';
  }

  const tip = TOPIC_TIPS[q.topicId] || "Read the question carefully and work through it step by step.";
  $('#clue-box').innerHTML = `<div class="feedback ok" style="margin:0 0 14px;">💡 Clue: ${tip}<br><span style="font-size:12px; opacity:.85;">One incorrect answer has been crossed out. Using a clue halves the points for this question.</span></div>`;

  const btn = $('#clue-btn');
  btn.disabled = true;
  btn.textContent = `💡 Clue used · ${SESSION.cluesRemaining} left`;
}

function submitAnswer(choiceIdx){
  if(SESSION.answered) return;
  SESSION.answered = true;
  clearInterval(timerInterval);
  const q = SESSION.current;
  const correct = choiceIdx === q.correctIndex;
  const buttons = $$('#opts .opt-btn');
  buttons.forEach((b,i)=>{
    if(i===q.correctIndex) b.classList.add('correct');
    else if(i===choiceIdx) b.classList.add('wrong');
    else b.classList.add('dim');
    b.disabled = true;
  });

  const stats = SESSION.perTopic[q.topicId];
  stats.answered++;
  PROGRESS.topicMastery[q.topicId] = PROGRESS.topicMastery[q.topicId] || {highestLevel:1, totalAnswered:0, totalCorrect:0};
  PROGRESS.topicMastery[q.topicId].totalAnswered++;
  PROGRESS.totalStats.totalQuestions++;

  const fb = $('#feedback');
  if(correct){
    stats.correct++;
    SESSION.correctCount++;
    SESSION.correctStreak++; SESSION.wrongStreak=0;
    SESSION.bestStreak = Math.max(SESSION.bestStreak, SESSION.correctStreak);
    let pts = SESSION.level*10 + (SESSION.correctStreak>=3?5:0);
    if(q.clueUsedThisQ) pts = Math.round(pts*0.5);
    SESSION.points += pts;
    PROGRESS.totalStats.totalCorrect++;
    PROGRESS.totalStats.totalPoints += pts;
    PROGRESS.topicMastery[q.topicId].totalCorrect++;
    PROGRESS.topicMastery[q.topicId].highestLevel = Math.max(PROGRESS.topicMastery[q.topicId].highestLevel, SESSION.level);
    fb.innerHTML = `<div class="feedback ok">✅ Correct! +${pts} points${q.clueUsedThisQ?' (clue used)':''}. ${q.explanation}</div>`;
    soundCorrect();
    if(SESSION.mode==='boss'){
      SESSION.bossHP = Math.max(0, SESSION.bossHP - SESSION.bossDamage);
    }
    if(!SESSION.fixedLevel && SESSION.correctStreak>0 && SESSION.correctStreak%2===0){
      const before = SESSION.level;
      SESSION.level = Math.min(12, SESSION.level+1);
      if(SESSION.level>before){ soundLevelUp(); showToast(`🎉 Level up! Now ${tierInfo(SESSION.level).name} (Lvl ${SESSION.level})`); }
    }
  } else {
    SESSION.wrongStreak++; SESSION.correctStreak=0;
    SESSION.reviewList.push({prompt:q.prompt, correctAnswer:q.options[q.correctIndex], explanation:q.explanation, topicId:q.topicId});
    fb.innerHTML = `<div class="feedback no">${choiceIdx===-1?"⏰ Time's up!":"❌ Not quite."} The correct answer was <strong>${q.options[q.correctIndex]}</strong>. ${q.explanation}</div>`;
    soundWrong();
    if(!SESSION.fixedLevel && SESSION.wrongStreak>=2){
      SESSION.level = Math.max(1, SESSION.level-1);
      SESSION.wrongStreak=0;
    }
  }

  SESSION.idx++;
  saveProgress(PROGRESS);

  const nextBtn = document.createElement('button');
  nextBtn.className='btn big'; nextBtn.textContent = SESSION.idx>=SESSION.questionCount ? 'See my results →' : 'Next question →';
  fb.appendChild(nextBtn);

  if(SESSION.mode==='challenge'){
    nextBtn.style.display='none';
    setTimeout(nextQuestion, correct?1200:2200);
  } else if(SESSION.mode==='speed'){
    nextBtn.style.display='none';
    if(SESSION.speedTimeLeft>0) setTimeout(nextQuestion, correct?500:900);
  } else if(SESSION.mode==='boss' && SESSION.bossHP<=0){
    nextBtn.textContent = 'See my results →';
    nextBtn.addEventListener('click', finishSession);
  } else {
    nextBtn.addEventListener('click', nextQuestion);
  }
}

/* =========================================================
   RESULTS SCREEN
========================================================= */
function finishSession(){
  clearInterval(timerInterval);
  clearInterval(speedTimerInterval);
  const durationSec = Math.round((Date.now()-SESSION.startTime)/1000);
  const answeredCount = SESSION.mode==='speed' ? SESSION.idx : SESSION.questionCount;
  const accuracy = answeredCount>0 ? Math.round(100*SESSION.correctCount/answeredCount) : 0;
  const xpBefore = Math.max(0, PROGRESS.totalStats.totalPoints - SESSION.points);
  const rankBefore = rankFromXP(xpBefore);
  const bossVictory = SESSION.mode==='boss' ? SESSION.bossHP<=0 : undefined;
  const session = {
    date: todayStr(),
    mode: SESSION.mode,
    topics: SESSION.topics,
    questionCount: answeredCount,
    correctCount: SESSION.correctCount,
    accuracy,
    maxLevel: SESSION.level,
    bestStreak: SESSION.bestStreak,
    points: SESSION.points,
    cluesUsed: SESSION.cluesUsed,
    durationSec,
    bossVictory,
  };
  PROGRESS.sessions.push(session);
  if(PROGRESS.sessions.length>80) PROGRESS.sessions.shift();
  recordPracticeDay();

  if(SESSION.mode==='daily'){
    const today = todayStr();
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    if(PROGRESS.daily.lastCompletedDate!==today){
      PROGRESS.daily.currentStreak = (PROGRESS.daily.lastCompletedDate===yesterday) ? PROGRESS.daily.currentStreak+1 : 1;
      PROGRESS.daily.longestStreak = Math.max(PROGRESS.daily.longestStreak, PROGRESS.daily.currentStreak);
      PROGRESS.daily.lastCompletedDate = today;
      PROGRESS.daily.completedDates.push(today);
      if(PROGRESS.daily.completedDates.length>120) PROGRESS.daily.completedDates.shift();
    }
    session.dailyStreak = PROGRESS.daily.currentStreak;
  }
  if(SESSION.mode==='boss' && bossVictory){
    PROGRESS.bossBattle.bossesDefeated++;
  }

  const newBadges = checkBadges();
  saveProgress(PROGRESS);
  const rankAfter = rankFromXP(PROGRESS.totalStats.totalPoints);
  renderResults(session, newBadges, rankAfter>rankBefore ? rankAfter : null);
  showScreen('results');
  if(accuracy>=80 || newBadges.length || rankAfter>rankBefore || bossVictory){ confettiBurst(); }
}

function renderResults(session, newBadges, rankUpTo){
  const el = document.getElementById('screen-results');
  const tier = tierInfo(session.maxLevel);
  const topicRows = session.topics.map(id=>{
    const t = topicById(id); const s = SESSION.perTopic[id];
    const acc = s.answered? Math.round(100*s.correct/s.answered) : 0;
    return `<tr><td class="topic-chip"><span class="swatch" style="background:${t.color};"></span>${t.icon} ${t.name}</td><td>${s.correct}/${s.answered}</td><td>${acc}%</td></tr>`;
  }).join('');
  const reviewRows = SESSION.reviewList.map(r=>{
    const t = topicById(r.topicId);
    return `<tr><td>${t.icon}</td><td>${r.prompt}</td><td><strong>${r.correctAnswer}</strong><br><span class="muted">${r.explanation}</span></td></tr>`;
  }).join('');

  let msg = "Nice work! Keep practicing and you'll be ready for the big day.";
  if(session.accuracy>=90) msg = "Outstanding! That's competition-ready form. 🏅";
  else if(session.accuracy>=75) msg = "Great job — you're really getting the hang of this!";
  else if(session.accuracy>=50) msg = "Solid effort! A bit more practice and you'll be flying.";
  else msg = "Good try! Every mistake is a step toward mastery — let's review a few together.";

  let headline = `Session Complete! ${session.accuracy>=90?'🏆':'🎉'}`;
  if(session.mode==='speed') headline = `Time's up! ⏱️`;
  if(session.mode==='boss') headline = session.bossVictory ? `Boss Defeated! 👑` : `Boss Battle Over 👹`;
  if(session.mode==='daily') headline = `Daily Challenge Complete! 🗓️`;

  let modeBanner = '';
  if(session.mode==='speed'){
    modeBanner = `<div class="boss-banner" style="background:linear-gradient(135deg,#ea580c,#f59e0b);">⚡ ${session.correctCount} correct in 60 seconds! Your best streak was ${session.bestStreak}.</div>`;
  } else if(session.mode==='boss'){
    modeBanner = session.bossVictory
      ? `<div class="boss-banner">👑 You defeated the boss! It took ${session.correctCount} correct answers to bring it down.</div>`
      : `<div class="boss-banner" style="background:linear-gradient(135deg,#475569,#1e293b);">💨 The boss got away this time — it'll be back. Give it another shot!</div>`;
  } else if(session.mode==='daily'){
    modeBanner = `<div class="boss-banner" style="background:linear-gradient(135deg,#0891b2,#0e7490);">🔥 ${session.dailyStreak}-day Daily Challenge streak! Come back tomorrow for a new one.</div>`;
  }

  el.innerHTML = `
    <h2>${headline}</h2>
    <p class="muted">${msg}</p>
    ${modeBanner}
    <div class="grid cols-4" style="margin:18px 0;">
      <div class="stat-card"><div class="num">${session.correctCount}/${session.questionCount}</div><div class="lbl">Correct</div></div>
      <div class="stat-card"><div class="num">${session.accuracy}%</div><div class="lbl">Accuracy</div></div>
      <div class="stat-card"><div class="num" style="color:${tier.color};">${tier.name}</div><div class="lbl">Top level (${session.maxLevel}/12)</div></div>
      <div class="stat-card"><div class="num">${session.points}</div><div class="lbl">Points earned</div></div>
    </div>
    <p class="muted" style="font-size:12.5px; margin-top:-8px;">💡 Clues used: ${session.cluesUsed}/3</p>

    ${rankUpTo? `<div class="rankup-banner">🎖️ Rank up! You're now Rank ${rankUpTo}: ${rankTitleFor(rankUpTo)}</div>` : ''}

    <h3 style="margin-top:20px;">Topic breakdown</h3>
    <table class="review"><thead><tr><th>Topic</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${topicRows}</tbody></table>

    ${newBadges.length? `<h3 style="margin-top:20px;">New badge${newBadges.length>1?'s':''} unlocked!</h3>${newBadges.map(b=>`<span class="badge-earned">${b.icon} ${b.name}</span>`).join('')}` : ''}

    ${SESSION.reviewList.length? `<h3 style="margin-top:20px;">Let's review these together</h3><table class="review"><thead><tr><th></th><th>Question</th><th>Answer & why</th></tr></thead><tbody>${reviewRows}</tbody></table>`:''}

    <div class="grid cols-2" style="margin-top:22px;">
      <button class="btn" id="again-btn">Practice again</button>
      <button class="btn secondary" id="home-btn">Back to home</button>
    </div>
  `;
  $('#again-btn').addEventListener('click', ()=>startSession());
  $('#home-btn').addEventListener('click', ()=>{ renderHome(); showScreen('home'); });
}

/* =========================================================
   PROGRESS SCREEN
========================================================= */
function renderProgress(){
  const el = document.getElementById('screen-progress');
  const overallAcc = PROGRESS.totalStats.totalQuestions ? Math.round(100*PROGRESS.totalStats.totalCorrect/PROGRESS.totalStats.totalQuestions) : 0;

  const masteryRows = TOPICS.map(t=>{
    const m = PROGRESS.topicMastery[t.id] || {highestLevel:0, totalAnswered:0, totalCorrect:0};
    const pct = Math.round((m.highestLevel/12)*100);
    const tier = tierInfo(Math.max(1,m.highestLevel));
    const acc = m.totalAnswered? Math.round(100*m.totalCorrect/m.totalAnswered):0;
    return `<div class="mastery-row">
      <div class="name"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${t.color};display:inline-block;"></span>${t.icon} ${t.name}</div>
      <div class="mastery-track"><div class="mastery-fill" style="width:${pct}%; background:${tier.color};"></div></div>
      <div class="mastery-pct">${m.highestLevel||0}/10 · ${acc}%</div>
    </div>`;
  }).join('');

  const last12 = PROGRESS.sessions.slice(-12);
  const accValues = last12.map(s=>s.accuracy);
  const pointValues = last12.map(s=>s.points);

  const days = [];
  for(let i=27;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    const did = PROGRESS.streak.practiceDates.includes(ds);
    const isToday = ds===todayStr();
    days.push(`<div class="heat-cell ${did?'did':''} ${isToday?'today':''}" title="${ds}"></div>`);
  }

  const insights = computeInsights();
  const trend = weeklyTrend();
  let trendHtml = '';
  if(trend){
    const cls = trend.delta>3?'trend-up':(trend.delta<-3?'trend-down':'trend-flat');
    const arrow = trend.delta>3?'📈':(trend.delta<-3?'📉':'➡️');
    const text = trend.delta>3? `Your accuracy is up ${trend.delta}% over your last 5 sessions compared to the 5 before — great growth!`
      : trend.delta<-3? `Your accuracy dipped ${Math.abs(trend.delta)}% over your last 5 sessions. A little revisiting should get things back on track.`
      : `Your accuracy has been steady over your recent sessions (${trend.recentAvg}%). Consistency is a great sign!`;
    trendHtml = `<div class="trend-banner ${cls}">${arrow} ${text}</div>`;
  }

  const focusCards = insights.focus.map(f=>`
    <div class="insight-card">
      <div class="info">
        <div style="font-weight:800;">${f.icon} ${f.name}</div>
        <div class="muted" style="font-size:12.5px; margin-top:4px;">${TOPIC_TIPS[f.id]}</div>
      </div>
      <div class="accbadge">${f.accuracy}%</div>
      <button class="btn secondary" data-focus="${f.id}">Practice this topic →</button>
    </div>
  `).join('');

  el.innerHTML = `
    <h2>Your progress 📈</h2>
    <div class="grid cols-4" style="margin-bottom:20px;">
      <div class="stat-card"><div class="num">${PROGRESS.sessions.length}</div><div class="lbl">Sessions</div></div>
      <div class="stat-card"><div class="num">${overallAcc}%</div><div class="lbl">Overall accuracy</div></div>
      <div class="stat-card"><div class="num">${PROGRESS.streak.longestStreakDays}</div><div class="lbl">Longest streak</div></div>
      <div class="stat-card"><div class="num">${PROGRESS.badges.length}/${BADGE_DEFS.length}</div><div class="lbl">Badges earned</div></div>
    </div>

    ${trendHtml}

    <h3 class="section-title">🎯 Improvement areas</h3>
    ${insights.focus.length ? focusCards : '<p class="muted">Complete a few sessions across different topics to unlock personalised insights here.</p>'}

    <h3 class="section-title" style="margin-top:22px;">📈 Growth over time</h3>
    <div class="grid cols-2">
      <div class="chart-wrap"><div class="muted" style="font-size:11px; margin-bottom:4px;">ACCURACY PER SESSION</div>${sparkline(accValues, {color:'#22c55e', min:0, max:100})}</div>
      <div class="chart-wrap"><div class="muted" style="font-size:11px; margin-bottom:4px;">POINTS PER SESSION</div>${sparkline(pointValues, {color:'#6366f1'})}</div>
    </div>

    <h3 class="section-title" style="margin-top:22px;">🧭 Topic mastery</h3>
    ${masteryRows || '<p class="muted">Complete a session to see your mastery levels.</p>'}

    <h3 class="section-title" style="margin-top:22px;">🗓️ Practice calendar (last 28 days)</h3>
    <div class="heatmap">${days.join('')}</div>

    <div style="margin-top:22px; text-align:center;">
      <button class="btn secondary" id="goto-achievements">🏅 View full Achievements dashboard →</button>
    </div>
  `;

  $$('[data-focus]').forEach(btn=>{
    btn.addEventListener('click', ()=> startSession(btn.dataset.focus));
  });
  $('#goto-achievements').addEventListener('click', ()=>{ renderAchievements(); showScreen('achievements'); });
}

/* =========================================================
   ACHIEVEMENTS SCREEN
========================================================= */
function renderAchievements(){
  const el = document.getElementById('screen-achievements');
  const xp = PROGRESS.totalStats.totalPoints;
  const rank = rankFromXP(xp);
  const title = rankTitleFor(rank);
  const curFloor = xpForRank(rank), nextFloor = xpForRank(rank+1);
  const pct = nextFloor>curFloor ? Math.min(100, Math.round(100*(xp-curFloor)/(nextFloor-curFloor))) : 100;
  const xpToNext = Math.max(0, nextFloor-xp);

  const cats = ['Milestones','Performance','Mastery','Consistency','Special'];
  const catBlocks = cats.map(cat=>{
    const badges = BADGE_DEFS.filter(b=>b.cat===cat);
    const tiles = badges.map(b=>{
      const earned = PROGRESS.badges.includes(b.id);
      let progHtml = '';
      if(!earned && b.progress){
        const [cur,target] = b.progress(PROGRESS);
        const p = Math.round(100*cur/target);
        progHtml = `<div style="height:5px; background:#e2e8f0; border-radius:99px; margin-top:6px; overflow:hidden;"><div style="height:100%; width:${p}%; background:#6366f1;"></div></div><div style="font-size:9px; color:var(--muted); margin-top:2px;">${cur}/${target}</div>`;
      }
      return `<div class="badge-tile ${earned?'earned':'locked'}" title="${b.desc}">
        <span class="ic">${b.icon}</span>${b.name}
        ${progHtml}
      </div>`;
    }).join('');
    return `<div class="badge-cat-title">${cat}</div><div class="badges-shelf">${tiles}</div>`;
  }).join('');

  el.innerHTML = `
    <h2>Achievements 🏅</h2>
    <div class="xp-hero">
      <div class="xp-mascot">🦉</div>
      <div style="flex:1;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px;">
          <strong style="font-size:18px;">Rank ${rank} · ${title}</strong>
          <span style="font-size:12px; opacity:.85;">${xp} XP total</span>
        </div>
        <div class="xp-track"><div class="xp-fill" style="width:${pct}%;"></div></div>
        <div style="font-size:11px; margin-top:4px; opacity:.85;">${xpToNext>0? `${xpToNext} XP to Rank ${rank+1}`:'Top rank reached — legendary! 🌟'}</div>
      </div>
    </div>

    <div style="margin-top:22px;">${catBlocks}</div>

    <h3 class="section-title" style="margin-top:26px;">🔗 Cross-device sync</h3>
    ${syncCode ? `
      <div class="insight-card" style="border-color:#c7d2fe; background:linear-gradient(135deg,#eef2ff,#f5f3ff);">
        <div class="info">
          <div style="font-weight:800; font-size:20px; letter-spacing:2px; color:#3730a3;">${syncCode}</div>
          <div class="muted" style="font-size:12.5px; margin-top:4px;">
            ${syncState==='syncing'?'🟡 Syncing…':syncState==='offline'?'🔴 Offline — will retry automatically':'🟢 Synced'} ·
            Enter this exact code on another device (Home button on the app, then Achievements) to see the same progress there.
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="btn secondary" id="copy-code-btn">📋 Copy code</button>
          <button class="btn secondary" id="stop-sync-btn">Stop syncing</button>
        </div>
      </div>
    ` : `
      <div class="insight-card" style="border-color:#c7d2fe; background:linear-gradient(135deg,#eef2ff,#f5f3ff);">
        <div class="info">
          <div style="font-weight:800;">Practice on more than one device?</div>
          <div class="muted" style="font-size:12.5px; margin-top:4px;">Create a sync code on this device, then enter the same code on another device (like a tablet or laptop) to share progress between them. No account needed.</div>
        </div>
      </div>
      <div class="choice-row" style="margin-top:10px;">
        <button class="btn" id="create-sync-btn">🔗 Create sync code</button>
      </div>
      <div class="choice-row" style="margin-top:10px;">
        <input type="text" id="join-code-input" placeholder="Have a code? Enter it here" maxlength="8" style="flex:2; min-width:160px; padding:12px; border-radius:12px; border:2px solid #e2e8f0; font-weight:700; letter-spacing:1px; text-transform:uppercase;"/>
        <button class="btn secondary" id="join-sync-btn" style="flex:1;">Join</button>
      </div>
    `}

    <h3 class="section-title" style="margin-top:26px;">💾 Local backup</h3>
    <p class="muted" style="font-size:13px;">A downloadable copy of your progress, separate from cloud sync — handy if you ever need to restore it.</p>
    <div class="choice-row">
      <button class="btn secondary" id="export-btn">⬇️ Export backup</button>
      <label class="btn secondary" style="text-align:center; cursor:pointer;">⬆️ Import backup<input type="file" id="import-input" accept="application/json" style="display:none;"/></label>
    </div>
  `;
  $('#export-btn').addEventListener('click', exportProgress);
  $('#import-input').addEventListener('change', importProgress);
  if(syncCode){
    $('#copy-code-btn').addEventListener('click', ()=>{
      navigator.clipboard?.writeText(syncCode).then(()=>showToast('📋 Code copied!')).catch(()=>showToast(`Your code: ${syncCode}`));
    });
    $('#stop-sync-btn').addEventListener('click', disableSync);
  } else {
    $('#create-sync-btn').addEventListener('click', enableSyncNew);
    $('#join-sync-btn').addEventListener('click', ()=> enableSyncJoin($('#join-code-input').value));
    $('#join-code-input').addEventListener('keydown', e=>{ if(e.key==='Enter') enableSyncJoin(e.target.value); });
  }
}

function exportProgress(){
  const blob = new Blob([JSON.stringify(PROGRESS,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `mav-maths-progress-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('📦 Backup downloaded!');
}
function importProgress(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !parsed.totalStats) throw new Error('Invalid backup file');
      PROGRESS = Object.assign(defaultProgress(), parsed);
      saveProgress(PROGRESS);
      showToast('✅ Progress restored!');
      renderAchievements();
    }catch(err){ showToast('⚠️ Could not read that backup file.'); }
  };
  reader.readAsText(file);
}

/* =========================================================
   INIT
========================================================= */
renderHome();
showScreen('home');
maybeShowOnboarding();
if(syncCode){ pullLatestIfNewer().then(()=>{ renderHome(); }); }

/* =========================================================
   PWA: service worker + install prompt
========================================================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed', err));
  });
}
let deferredInstallPrompt = null;
const installBtn = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.classList.remove('hidden');
});
installBtn.addEventListener('click', async ()=>{
  if(!deferredInstallPrompt) return;
  installBtn.classList.add('hidden');
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});
window.addEventListener('appinstalled', ()=>{ installBtn.classList.add('hidden'); showToast('🎉 App installed! Find it on your home screen.'); });
</script>
